name: Android native application

on:
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - main
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable release signing
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/colors-signing"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/colors-signing/colors-camera-release.p12"
          chmod 600 "$RUNNER_TEMP/colors-signing/colors-camera-release.p12"

      - name: Verify bundled sky mask matches the reference calibration
        working-directory: android-native
        run: cmp ../android/sky-mask.json app/src/main/res/raw/sky_mask.json

      - name: Test and assemble signed release APK
        working-directory: android-native
        env:
          COLORS_SIGNING_STORE_FILE: ${{ runner.temp }}/colors-signing/colors-camera-release.p12
          COLORS_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          COLORS_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          COLORS_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease lintRelease --stacktrace

      - name: Verify stable signing certificate
        working-directory: android-native
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          certificate_output="$($apksigner verify --print-certs "$apk")"
          printf '%s\n' "$certificate_output"
          actual="$(printf '%s\n' "$certificate_output" \
            | awk -F': ' '/certificate SHA-256 digest:/ { print tolower($NF); exit }')"
          expected="419106390ce9828fbcf9f4702b859cfd0ecd048c0ecd4fb56d81321bab1fb7f8"
          test -n "$actual"
          test "$actual" = "$expected"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: colors-camera-release
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
