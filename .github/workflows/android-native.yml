name: Android native application

on:
  pull_request:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  push:
    branches:
      - main
    paths:
      - "android-native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify bundled sky mask matches the reference calibration
        working-directory: android-native
        run: cmp ../android/sky-mask.json app/src/main/res/raw/sky_mask.json

      - name: Test and assemble debug APK
        working-directory: android-native
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: colors-camera-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
